name: deploy-docs

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_type:
        description: Version increment for this deployment
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      baidu_urls: ${{ steps.collect-baidu-urls.outputs.urls }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Bump deployment version
        env:
          RELEASE_TYPE: ${{ github.event.inputs.release_type || 'patch' }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";

          const releaseType = process.env.RELEASE_TYPE;
          const packageJson = JSON.parse(readFileSync("package.json", "utf8"));
          const packageLock = JSON.parse(readFileSync("package-lock.json", "utf8"));
          const match = /^(\d+)\.(\d+)\.(\d+)$/.exec(packageJson.version);

          if (!match || !["patch", "minor", "major"].includes(releaseType)) {
            throw new Error(`Cannot bump version ${packageJson.version} with release type ${releaseType}`);
          }

          let [major, minor, patch] = match.slice(1).map(Number);
          if (releaseType === "major") {
            major += 1;
            minor = 0;
            patch = 0;
          } else if (releaseType === "minor") {
            minor += 1;
            patch = 0;
          } else {
            patch += 1;
          }

          const version = `${major}.${minor}.${patch}`;
          packageJson.version = version;
          packageLock.version = version;
          packageLock.packages[""].version = version;
          writeFileSync("package.json", `${JSON.stringify(packageJson, null, 2)}\n`);
          writeFileSync("package-lock.json", `${JSON.stringify(packageLock, null, 2)}\n`);

          console.log(`Bumped package version to ${version}`);
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: release v$(node -p "require('./package.json').version") [skip ci]"
          git push origin "HEAD:${BRANCH_NAME}"

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build VuePress site
        run: npm run docs:build

      - name: Collect changed URLs for Baidu
        id: collect-baidu-urls
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from "node:fs";
          import { execFileSync } from "node:child_process";

          const before = process.env.BEFORE_SHA;
          const after = process.env.AFTER_SHA;
          const urls = [];
          const base = before || execFileSync("git", ["rev-parse", `${after}^`], { encoding: "utf8" }).trim();

          if (base && !/^0+$/.test(base)) {
            const changedFiles = execFileSync(
              "git",
              ["diff", "--name-only", "--diff-filter=ACMRT", "-z", base, after, "--", "src"],
              { encoding: "utf8" },
            )
              .split("\0")
              .filter((file) => file.endsWith(".md"));
            const routesSource = readFileSync("src/.vuepress/.temp/internal/routes.js", "utf8");
            const routes = [...routesSource.matchAll(/^\s*\["([^"]+)", \{ loader: \(\) => import\([^)]*?"([^"]+\.md)"\)/gm)];

            for (const file of changedFiles) {
              const route = routes.find(([, , source]) => source.endsWith(`/src/${file.slice("src/".length)}`))?.[1];
              if (route) urls.push(`https://www.pasthk.com${route}`);
            }
          }

          appendFileSync(process.env.GITHUB_OUTPUT, `urls=${JSON.stringify([...new Set(urls)])}\n`);
          console.log(`Collected ${urls.length} changed page URL(s) for Baidu.`);
          NODE

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: src/.vuepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1

      - name: Submit URLs to Baidu
        env:
          BAIDU_API_URL: ${{ secrets.BAIDU_API_URL }}
          BAIDU_URLS_JSON: ${{ needs.build.outputs.baidu_urls }}
        run: |
          node --input-type=module <<'NODE'
          const urls = JSON.parse(process.env.BAIDU_URLS_JSON || "[]");
          if (urls.length === 0) {
            console.log("No changed Markdown pages; skipping Baidu submission.");
            process.exit(0);
          }

          if (!process.env.BAIDU_API_URL) {
            throw new Error("Missing BAIDU_API_URL secret");
          }

          const response = await fetch(process.env.BAIDU_API_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain" },
            body: urls.join("\n"),
          });
          const result = await response.text();
          console.log(result);

          let data;
          try {
            data = JSON.parse(result);
          } catch {}

          if (data?.message === "over quota") {
            console.warn("Baidu daily quota is exhausted; skipping submission without failing deployment.");
          } else if (!response.ok || data?.error) {
            throw new Error(`Baidu URL submission failed: ${data?.message ?? response.status}`);
          }
          NODE